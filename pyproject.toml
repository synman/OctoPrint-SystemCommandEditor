[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-SystemCommandEditor"
version = "2.1.0.dev1"
description = "Add, edit, reorder and group the commands in the OctoPrint System menu"
authors = [
    { name = "Shell M. Shrader", email = "shell@shellware.com" },
    { name = "Marc Hannappel" },
]
requires-python = ">=3.7,<4"
dependencies = []
dynamic = [
    "license",
]

[project.entry-points."octoprint.plugin"]
systemcommandeditor = "octoprint_systemcommandeditor"

[project.urls]
Homepage = "https://github.com/synman/OctoPrint-SystemCommandEditor"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_systemcommandeditor",
    "octoprint_systemcommandeditor.*",
]
